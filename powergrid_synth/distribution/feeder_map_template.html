<!doctype html>
<!-- Author: Adam Lahmar <adam.lahmar@rwth-aachen.de> -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Feeder map - real and synthetic network</title>
<style>
  :root {
    --bg: #000; --panel: #09090b; --panel-2: #0e0e12; --line: #1b1b20; --grid: rgba(255,255,255,0.035);
    --ink: #f2f2f4; --ink-dim: #a1a1aa; --ink-faint: #62626b;
    --load: #f4f4f5; --gen: #e5383b; --warn: #f5a524; --ok: #3ddc97; --cable: #cfcfd6; --switch: #6e6e78; --junction: #52525b;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--ink); overflow: auto; }
  body { min-height: 640px; font-family: "Inter", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif; -webkit-font-smoothing: antialiased; display: flex; flex-direction: column; }
  .num { font-variant-numeric: tabular-nums; }

  /* ---------------------------------------------------------------- header + toolbar */
  header { display: flex; align-items: center; justify-content: space-between; gap: 24px; padding: 12px 22px; border-bottom: 1px solid var(--line); flex: none; }
  h1 { margin: 0; font-size: 16px; font-weight: 600; letter-spacing: 0.01em; }
  .sub { margin-top: 3px; font-size: 11.5px; color: var(--ink-dim); }
  #kpis { display: flex; gap: 26px; }
  .kpi { text-align: right; }
  .kpi b { display: block; font-size: 17px; font-weight: 600; }
  .kpi span { font-size: 9.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-faint); }

  #toolbar { display: flex; align-items: center; gap: 22px; padding: 9px 22px; border-bottom: 1px solid var(--line); flex: none; flex-wrap: wrap; }
  .ctl { display: flex; align-items: center; gap: 9px; }
  .ctl > label { font-size: 9.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-faint); }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: var(--panel); }
  .seg button { background: none; border: 0; color: var(--ink-dim); font: inherit; font-size: 12px; padding: 6px 12px; cursor: pointer; border-right: 1px solid var(--line); }
  .seg button:last-child { border-right: 0; }
  .seg button:hover { color: var(--ink); }
  .seg button.on { background: #1a1a20; color: var(--ink); }
  select { background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; font: inherit; font-size: 12px; padding: 6px 10px; cursor: pointer; }
  select:hover { border-color: #3a3a42; }
  select:focus-visible { outline: 1px solid #8a8a93; outline-offset: -1px; }
  .seg button:focus-visible, .btn:focus-visible, input:focus-visible { outline: 1px solid #8a8a93; outline-offset: -1px; }
  .btn { background: var(--panel); border: 1px solid var(--line); color: var(--ink-dim); border-radius: 6px; font: inherit; font-size: 12px; padding: 6px 11px; cursor: pointer; }
  .btn.on { color: var(--ink); background: #1a1a20; }
  .btn:hover { color: var(--ink); }
  #search { background: var(--panel); border: 1px solid var(--line); color: var(--ink); border-radius: 6px; padding: 6px 10px; font: inherit; font-size: 12px; width: 130px; }
  #search::placeholder { color: var(--ink-faint); }
  #spacer { flex: 1; }

  /* ---------------------------------------------------------------- map + inspector */
  #main { flex: 1; min-height: 0; display: flex; }
  #stage { position: relative; flex: 1; min-width: 0; min-height: 320px; }
  svg#map { width: 100%; height: 100%; display: block; cursor: grab; background: radial-gradient(ellipse at 20% 40%, #0b0b10, #000 70%); --k: 1; }
  svg#map.drag { cursor: grabbing; }
  .gridline { stroke: var(--grid); stroke-width: 1; vector-effect: non-scaling-stroke; }
  .axis { fill: var(--ink-faint); font-size: calc(10px / var(--k)); }
  .e { stroke-linecap: round; vector-effect: non-scaling-stroke; fill: none; transition: opacity .12s; }
  .e.line { stroke: var(--cable); }
  .e.switch { stroke: var(--switch); stroke-width: 1px; stroke-dasharray: 2 3; }
  .e.breaker, .e.transformer { stroke: #fff; stroke-width: 2px; }
  .hit { stroke: transparent; stroke-width: 12px; vector-effect: non-scaling-stroke; fill: none; cursor: pointer; }
  .sym { vector-effect: non-scaling-stroke; transition: opacity .12s; }
  .swm { fill: #000; stroke: var(--switch); stroke-width: 1px; vector-effect: non-scaling-stroke; display: none; }
  svg#map.z2 .swm { display: block; }
  .n { cursor: pointer; transition: opacity .12s; }
  .n .shape { vector-effect: non-scaling-stroke; stroke-width: 1.2px; }
  .dim { opacity: 0.16; }
  .lbl { fill: var(--ink-dim); font-size: calc(11px / var(--k)); pointer-events: none; paint-order: stroke; stroke: #000; stroke-width: calc(3px / var(--k)); }
  .lbl.strong { fill: var(--ink); font-weight: 600; }
  .lbl.elen { fill: var(--ink-faint); font-size: calc(9.5px / var(--k)); text-anchor: middle; }
  .lbl.det { display: none; }
  svg#map.z2 .lbl.det { display: block; }
  svg#map.z3 .lbl.det3 { display: block; }
  .lbl.det3 { display: none; }
  .sel { stroke: #fff !important; stroke-width: 2px !important; }
  .n:hover .shape { stroke-width: 2.6px !important; filter: drop-shadow(0 0 3px rgba(255,255,255,.55)); }
  #world { transition: opacity .16s ease; }
  table.cmp td { text-align: right; white-space: nowrap; padding-left: 8px; } table.cmp td:first-child { text-align: left; white-space: normal; padding-left: 0; } table.cmp th.r { text-align: right; } .cmp .gp { color: var(--ink-faint); font-size: 11px; }
  table.cmp { font-size: 11.5px; }
  .tag { display: inline-block; font-size: 10px; color: var(--ink-faint); margin-left: 5px; }

  .overlay { position: absolute; background: rgba(9,9,11,0.92); border: 1px solid var(--line); border-radius: 8px; backdrop-filter: blur(4px); }
  #legend { right: 14px; bottom: 14px; padding: 12px 14px 10px; width: 262px; font-size: 12px; }
  #legend h3, #inspector h3 { margin: 0 0 8px; font-size: 9.5px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-faint); }
  .lg { display: grid; grid-template-columns: 26px 1fr auto; align-items: center; gap: 4px 8px; padding: 2.5px 0; color: var(--ink-dim); }
  .lg svg { width: 26px; height: 14px; display: block; }
  .lg b { color: var(--ink); font-weight: 500; }
  .scale { margin-top: 8px; }
  .scale .bar { height: 7px; border-radius: 3px; }
  .scale .ticks { display: flex; justify-content: space-between; font-size: 10px; color: var(--ink-faint); margin-top: 3px; }
  #zoom { right: 14px; top: 12px; display: flex; flex-direction: column; }
  #zoom button { width: 34px; height: 34px; background: none; border: 0; border-bottom: 1px solid var(--line); color: var(--ink-dim); font-size: 17px; cursor: pointer; }
  #zoom button:last-child { border-bottom: 0; font-size: 14px; }
  #zoom button:hover { color: var(--ink); background: #15151a; }
  #hint { left: 14px; top: 12px; padding: 7px 11px; font-size: 11px; color: var(--ink-dim); }
  #tip { position: fixed; pointer-events: none; z-index: 9; padding: 6px 9px; font-size: 11.5px; line-height: 1.45; background: rgba(14,14,18,0.97); border: 1px solid #2a2a31; border-radius: 6px; display: none; max-width: 260px; }

  #inspector { width: 384px; flex: none; border-left: 1px solid var(--line); background: var(--panel); overflow-y: auto; padding: 16px 18px 24px; }
  #inspector h2 { margin: 0; font-size: 15px; font-weight: 600; }
  #inspector .meta { margin: 3px 0 12px; font-size: 11.5px; color: var(--ink-dim); }
  .chip { display: inline-block; font-size: 9.5px; letter-spacing: 0.1em; text-transform: uppercase; padding: 2px 8px; border-radius: 10px; border: 1px solid #33333b; color: var(--ink-dim); margin-right: 6px; }
  .chip.red { color: var(--gen); border-color: rgba(229,56,59,.5); } .chip.amber { color: var(--warn); border-color: rgba(245,165,36,.5); }
  table.kv { width: 100%; border-collapse: collapse; margin: 0 0 14px; font-size: 12px; }
  table.kv td { padding: 4px 0; border-bottom: 1px solid #141418; color: var(--ink-dim); vertical-align: top; }
  table.kv td:last-child { text-align: right; color: var(--ink); }
  table.kv th { text-align: left; font-weight: 500; font-size: 9.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-faint); padding: 8px 0 4px; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 7px; vertical-align: 0; }
  .note { font-size: 11.5px; color: var(--ink-faint); line-height: 1.5; margin-top: 4px; }
  .bar2 { height: 5px; background: #17171c; border-radius: 3px; overflow: hidden; margin-top: 3px; }
  .bar2 i { display: block; height: 100%; }
  @media (max-width: 1100px) { #inspector { display: none; } #kpis { display: none; } }
</style>
</head>
<body>

<header>
  <div>
    <h1 id="title">ENEL MV feeder &middot; network map</h1>
    <div class="sub" id="netname"></div>
  </div>
  <div id="kpis"></div>
</header>

<div id="toolbar">
  <div class="ctl" id="ctl-feeder" style="display:none"><label>Feeder</label><select id="sel-feeder" aria-label="Feeder"></select></div>
  <div class="ctl"><label>Network</label><div class="seg" id="seg-net"></div></div>
  <div class="ctl"><label>Operating point</label><div class="seg" id="seg-sc"></div></div>
  <div class="ctl"><label>Colour by</label><div class="seg" id="seg-color"></div></div>
  <div class="ctl"><label>Horizontal axis</label><div class="seg" id="seg-x"></div></div>
  <div class="ctl"><button class="btn on" id="btn-sw">Switches</button><button class="btn on" id="btn-lab">Labels</button></div>
  <div id="spacer"></div>
  <input id="search" placeholder="Find bus #" aria-label="Find bus by number">
</div>

<div id="main">
  <div id="stage">
    <svg id="map" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Network map">
      <g id="world"><g id="grid"></g><g id="edges"></g><g id="syms"></g><g id="nodes"></g><g id="labels"></g></g>
    </svg>
    <div class="overlay" id="hint">Scroll to zoom &middot; drag to pan &middot; click a bus, cable, switch or the transformer</div>
    <div class="overlay" id="legend"></div>
    <div class="overlay" id="zoom"><button id="z-in" aria-label="Zoom in">+</button><button id="z-out" aria-label="Zoom out">&minus;</button><button id="z-fit" aria-label="Fit to window">&#8634;</button></div>
  </div>
  <aside id="inspector"></aside>
</div>
<div id="tip"></div>

<script>
const DATA = __DATA_JSON__;
const CASES = DATA.cases || [DATA];
let CASE = CASES[0], SCEN = CASE.scenarios, NETS = CASE.networks;
const SVGNS = "http://www.w3.org/2000/svg";
const S = { net: "real", sc: 0, color: "type", x: "hop", sw: true, lab: true, sel: null };
const $ = (id) => document.getElementById(id);
const svg = $("map"), world = $("world"), gGrid = $("grid"), gEdges = $("edges"), gSyms = $("syms"), gNodes = $("nodes"), gLab = $("labels"), tip = $("tip");
const T = { k: 1, x: 0, y: 0 };
const W = 2400;                         // world width of the horizontal axis
let YS = 15;                            // vertical spacing of the tidy tree, adapted to the network in prepare()
const EQ = 80;                          // extra spacing of each of the first three levels, so that source, transformer, busbar and breaker have room
let N;                                  // prepared current network

const el = (name, attrs = {}, parent) => { const e = document.createElementNS(SVGNS, name); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
const lenM = (km) => { const m = km * 1000; return (m >= 100 ? m.toFixed(1) : m.toFixed(2)) + " m"; };   // never rounded to whole metres: a 0.4 m cable shows 0.40 m
const kv = (v) => (v >= 1 ? v.toFixed(0) : String(+v.toFixed(3)));
const gapTxt = (x, y) => (x === null || y === null || x === undefined || y === undefined || Math.abs(x) < 1e-9) ? "" : (((y - x) / x * 100) >= 0 ? "+" : "") + ((y - x) / x * 100).toFixed(1) + " %";
const RES = [[0, "#4a4a52"], [0.5, "#d4d4d8"], [1, "#f5a524"]];
const fmt = (v, d = 1) => (v === null || v === undefined || Number.isNaN(v)) ? "-" : Number(v).toFixed(d);

// ------------------------------------------------------------------ colours
function hex(c) { return [1, 3, 5].map((i) => parseInt(c.slice(i, i + 2), 16)); }
function ramp(stops, v) {
  if (v === null || v === undefined || Number.isNaN(v)) return "#52525b";
  if (v <= stops[0][0]) return stops[0][1];
  for (let i = 1; i < stops.length; i++) if (v <= stops[i][0]) {
    const [a, ca] = stops[i - 1], [b, cb] = stops[i], t = (v - a) / (b - a), A = hex(ca), B = hex(cb);
    return "rgb(" + A.map((x, j) => Math.round(x + (B[j] - x) * t)).join(",") + ")";
  }
  return stops[stops.length - 1][1];
}
const VM = [[0.86, "#e5383b"], [0.90, "#f0602a"], [0.94, "#f5a524"], [0.97, "#d4d4d8"], [1.0, "#6b6b75"]];
const LD = [[0, "#4a4a52"], [40, "#8a8a93"], [70, "#d4d4d8"], [90, "#f5a524"], [110, "#f0602a"], [150, "#e5383b"]];

// ------------------------------------------------------------------ prepare a network
function prepare(key) {
  const net = NETS[key], byId = new Map();
  net.nodes.forEach((n) => byId.set(n.id, n));
  net.edges.forEach((e) => { e.A = byId.get(e.a); e.B = byId.get(e.b); });
  const maxHop = Math.max(...net.nodes.map((n) => n.hop)), maxDist = Math.max(...net.nodes.map((n) => n.dist)) || 1;
  const maxY = Math.max(...net.nodes.map((n) => n.y));
  YS = Math.max(14, Math.min(32, 1500 / maxY));           // fill the window: about 1500 world units high
  const edgeOf = new Map(net.edges.map((e) => [e.a + "-" + e.b, e]).concat(net.edges.map((e) => [e.b + "-" + e.a, e])));
  const rs = net.edges.filter((e) => e.kind === "line").map((e) => e.r), rMin = rs.length ? Math.min(...rs) : 0, rMax = rs.length ? Math.max(...rs) : 1;
  return { key, net, byId, maxHop, maxDist, maxY, edgeOf, rMin, rMax };
}
function pathTo(n) {               // nodes and edges from a bus back to the source
  const nodes = [], edges = [];
  for (let c = n; c; c = c.parent === null ? null : N.byId.get(c.parent)) {
    nodes.push(c);
    if (c.parent !== null) edges.push(N.edgeOf.get(c.id + "-" + c.parent));
  }
  return { nodes, edges };
}
const px = (n) => (S.x === "hop" ? n.hop / N.maxHop : n.dist / N.maxDist) * W + EQ * Math.min(n.hop, 3);
const py = (n) => n.y * YS;
const rOf = (n) => n.kind === "junction" ? 2.7 : Math.min(15, 4.2 + 3.1 * Math.sqrt(n.p_load + n.p_gen));

// ------------------------------------------------------------------ build DOM for the current network
function build() {
  [gGrid, gEdges, gSyms, gNodes, gLab].forEach((g) => (g.textContent = ""));
  N.net.edges.forEach((e) => {
    e.el = el("line", { class: "e " + e.kind }, gEdges);
    e.hit = el("line", { class: "hit" }, gEdges);
    for (const t of [e.hit]) {
      t.addEventListener("mouseenter", (ev) => showTip(edgeTip(e), ev)); t.addEventListener("mousemove", moveTip); t.addEventListener("mouseleave", hideTip);
      t.addEventListener("click", (ev) => { ev.stopPropagation(); select({ edge: e }); });
    }
    if (e.kind === "transformer") {
      e.sym = el("g", { class: "sym" }, gSyms); e.c1 = el("circle", { r: 8, fill: "#000", stroke: "#fff", "stroke-width": 1.6, "vector-effect": "non-scaling-stroke" }, e.sym);
      e.c2 = el("circle", { r: 8, fill: "#000", stroke: "#fff", "stroke-width": 1.6, "vector-effect": "non-scaling-stroke" }, e.sym);
      e.lab = el("text", { class: "lbl strong" }, gLab); e.lab.textContent = `Transformer ${e.sn_mva.toFixed(0)} MVA`;
    } else if (e.kind === "breaker") {
      e.sym = el("rect", { class: "sym", width: 10, height: 10, fill: "#fff", stroke: "#fff", "vector-effect": "non-scaling-stroke" }, gSyms);
      e.lab = el("text", { class: "lbl strong det" }, gLab); e.lab.textContent = "Breaker (closed)";
    } else if (e.kind === "switch") {
      e.sym = el("rect", { class: "swm", width: 5, height: 5 }, gSyms);
    } else {
      e.lab = el("text", { class: "lbl elen det3" }, gLab); e.lab.textContent = lenM(e.length_km);
    }
  });
  N.net.nodes.forEach((n) => {
    n.g = el("g", { class: "n" }, gNodes);
    if (n.kind === "source") n.shape = el("rect", { class: "shape", width: 16, height: 16, fill: "#fff", stroke: "#fff" }, n.g);
    else if (n.kind === "busbar") n.shape = el("rect", { class: "shape", width: 6, height: 26, fill: "#fff", stroke: "#fff" }, n.g);
    else n.shape = el("circle", { class: "shape" }, n.g);
    n.g.addEventListener("mouseenter", (ev) => showTip(nodeTip(n), ev)); n.g.addEventListener("mousemove", moveTip); n.g.addEventListener("mouseleave", hideTip);
    n.g.addEventListener("click", (ev) => { ev.stopPropagation(); select({ node: n }); });
    const powered = n.p_load + n.p_gen;
    if (n.kind === "source" || n.kind === "busbar" || powered >= 0.2) {
      n.lab = el("text", { class: "lbl strong" + (n.kind === "source" || n.kind === "busbar" ? " det" : "") }, gLab);
      n.lab.textContent = n.kind === "source" ? `${kv(n.vn)} kV grid` : n.kind === "busbar" ? `${kv(n.vn)} kV busbar` : powered >= 1 ? (n.p_gen > n.p_load ? `${fmt(n.p_gen, 2)} MW gen.` : `${fmt(n.p_load, 2)} MW load`) : `#${n.id}`;
    } else if (n.kind !== "junction") {
      n.lab = el("text", { class: "lbl det" }, gLab); n.lab.textContent = `#${n.id}`;
    }
  });
  fit(false);
}

// ------------------------------------------------------------------ position + paint
function layout() {
  const maxX = W, maxYw = N.maxY * YS;
  for (let d = 0; ; d++) break;
  gGrid.textContent = "";
  const step = S.x === "hop" ? 8 : 5000 / 5000;        // grid every 8 hops or every 1 km
  const total = S.x === "hop" ? N.maxHop : N.maxDist;
  for (let v = 0; v <= total; v += step) {
    const x = (v / total) * W + 3 * EQ;
    el("line", { class: "gridline", x1: x, x2: x, y1: -40, y2: maxYw + 30 }, gGrid);
    const t = el("text", { class: "axis", x: x + 4, y: -26 }, gGrid); t.textContent = S.x === "hop" ? `${v} hops` : `${v} km`;
  }
  N.net.edges.forEach((e) => {
    const x1 = px(e.A), y1 = py(e.A), x2 = px(e.B), y2 = py(e.B), mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
    [e.el, e.hit].forEach((l) => { l.setAttribute("x1", x1); l.setAttribute("y1", y1); l.setAttribute("x2", x2); l.setAttribute("y2", y2); });
    if (e.kind === "transformer") { e.c1.setAttribute("cx", mx - 5); e.c1.setAttribute("cy", my); e.c2.setAttribute("cx", mx + 5); e.c2.setAttribute("cy", my); e.lab.setAttribute("x", mx + 18); e.lab.setAttribute("y", my - 14); }
    else if (e.kind === "breaker") { e.sym.setAttribute("x", mx - 5); e.sym.setAttribute("y", my - 5); e.lab.setAttribute("x", mx + 10); e.lab.setAttribute("y", my - 10); }
    else if (e.kind === "switch") { e.sym.setAttribute("x", mx - 2.5); e.sym.setAttribute("y", my - 2.5); }
    else { e.lab.setAttribute("x", mx); e.lab.setAttribute("y", my - 4); }
  });
  N.net.nodes.forEach((n) => {
    const x = px(n), y = py(n);
    if (n.kind === "source") { n.shape.setAttribute("x", x - 8); n.shape.setAttribute("y", y - 8); }
    else if (n.kind === "busbar") { n.shape.setAttribute("x", x - 3); n.shape.setAttribute("y", y - 13); }
    else { n.shape.setAttribute("cx", x); n.shape.setAttribute("cy", y); }
    if (n.lab) { n.lab.setAttribute("x", x + (n.kind === "source" ? 14 : rOf(n) + 5)); n.lab.setAttribute("y", y + 4); }
  });
  applyScale();
}

function nodeStyle(n) {
  const v = n.vm[S.sc];
  let fill, stroke;
  if (S.color === "voltage") { fill = n.kind === "junction" ? "#0b0b0e" : ramp(VM, v); stroke = ramp(VM, v); if (n.kind === "source" || n.kind === "busbar") { fill = "#fff"; stroke = "#fff"; } }
  else {
    stroke = n.kind === "junction" ? "#52525b" : n.kind === "generation" ? "#e5383b" : n.kind === "prosumer" ? "#e5383b" : "#f4f4f5";
    fill = n.kind === "junction" ? "#0b0b0e" : n.kind === "generation" ? "#e5383b" : "#f4f4f5";
    if (n.kind === "source" || n.kind === "busbar") { fill = "#fff"; stroke = "#fff"; }
  }
  n.shape.style.fill = fill; n.shape.style.stroke = stroke; n.shape.style.strokeWidth = n.kind === "prosumer" ? "2.4px" : "1.2px";
}
function edgeStyle(e) {
  if (e.kind !== "line") { e.el.style.stroke = ""; if (e.kind === "transformer") e.c1.style.stroke = e.c2.style.stroke = S.color === "loading" ? ramp(LD, e.loading[S.sc]) : "#fff"; return; }
  e.el.style.stroke = S.color === "loading" ? ramp(LD, e.loading[S.sc]) : S.color === "resistance" ? ramp(RES, N.rMax > N.rMin ? (e.r - N.rMin) / (N.rMax - N.rMin) : 0.5) : "";
  e.el.style.strokeWidth = (0.9 + e.i_max * 4.2) + "px";
}
function paint() {
  const hl = S.sel ? S.sel.path : null;
  const nodeSet = hl ? new Set(hl.nodes) : null, edgeSet = hl ? new Set(hl.edges) : null;

  const n = N.byId.get(Number(ev.target.value.replace("#", "")));
  if (!n) { ev.target.style.borderColor = "#e5383b"; return; }
  ev.target.style.borderColor = ""; select({ node: n });
  const r = svg.getBoundingClientRect(); T.k = Math.max(T.k, 3); T.x = r.width / 2 - px(n) * T.k; T.y = r.height / 2 - py(n) * T.k; applyT();
});
window.addEventListener("keydown", (ev) => { if (ev.key === "Escape") select(null); });

function setCase(i) {
  CASE = CASES[i]; SCEN = CASE.scenarios; NETS = CASE.networks;
  S.net = "real"; S.sc = 0; S.sel = null;
  if (CASES.length > 1) { $("title").textContent = "Feeder map \u00b7 " + CASE.label; document.title = "Feeder map - " + CASE.label; }
  scenSeg(); update("net");
}
if (CASES.length > 1) {
  $("ctl-feeder").style.display = "";
  CASES.forEach((c, i) => { const o = document.createElement("option"); o.value = i; o.textContent = c.label; $("sel-feeder").appendChild(o); });
  $("sel-feeder").onchange = () => setCase(Number($("sel-feeder").value));
  $("title").textContent = "Feeder map \u00b7 " + CASE.label;
}
N = prepare(S.net); build(); layout(); syncSeg(); paint(); inspector();
</script>
</body>
